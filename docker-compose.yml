services:
  postgres:
    image: postgres:17-alpine
    container_name: clickstream-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: clickstream
      POSTGRES_USER: clickstream
      POSTGRES_PASSWORD: clickstream
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clickstream -d clickstream"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.2
    container_name: clickstream-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  api:
    build: ./backend
    container_name: clickstream-api
    ports:
      - "3000:3000"
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_TOPIC: clickstream-events
      DATABASE_URL: postgresql://clickstream:clickstream@postgres:5432/clickstream
      FRONTEND_URL: http://localhost:5173
      ADMIN_NAME: ${ADMIN_NAME:-Vantage Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vantage.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - product-images:/app/uploads
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres-data:
  product-images:
